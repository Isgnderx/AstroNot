    <div class="page-top" id="top">
      <header class="site-header frame" data-header>
        <a class="wordmark" href="../index.html" data-route="/" aria-label="AstroNot home">
          <img src="../assets/mark.svg" width="40" height="40" alt="">
          <span>AstroNot<span class="wordmark__period">.</span></span>
        </a>
        <button class="menu-toggle icon-button" type="button" aria-label="Menu" aria-controls="site-nav" aria-expanded="false" data-menu-toggle hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="menu-toggle__open" d="M4 8h16M4 16h16"/>
            <path class="menu-toggle__close" d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Main navigation">
          <a href="../explore/index.html" data-route="/explore" aria-current="page">Explore</a>
          <a href="../tools/index.html" data-route="/tools">Tools</a>
          <a href="../learn/index.html" data-route="/learn">Learn</a>
          <a href="../about/index.html" data-route="/about">About</a>
        </nav>
      </header>
    </div>

    <main id="page-content" tabindex="-1">
      <section class="explore section-space frame" id="explore" aria-labelledby="explore-title" tabindex="-1">
        <div class="atlas__intro">
          <h1 class="section-title" id="explore-title" data-reveal>Explore the sky</h1>
          <p class="section-lede" data-reveal data-delay="1">Follow three observations from the rings of Saturn to the arms of a distant galaxy.</p>
          <div class="atlas__tabs" aria-label="Choose an object" data-atlas-tabs data-reveal data-delay="2">
            <a class="atlas__tab" id="tab-whirlpool" href="#whirlpool">
              <span><strong>Whirlpool Galaxy</strong><small>Spiral galaxy · M51</small></span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
            </a>
            <a class="atlas__tab" id="tab-orion" href="#orion">
              <span><strong>Orion Nebula</strong><small>Stellar nursery · M42</small></span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
            </a>
            <a class="atlas__tab" id="tab-saturn" href="#saturn">
              <span><strong>Saturn</strong><small>Ringed planet · Solar System</small></span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
            </a>
          </div>
        </div>

        <div class="atlas__panels" data-reveal data-delay="1">
          <article class="atlas__panel" id="whirlpool">
            <figure>
              <img class="atlas__photo" src="../assets/whirlpool.jpg" alt="The blue and rose spiral arms of the Whirlpool Galaxy beside its smaller companion" width="1280" height="888" loading="lazy" decoding="async">
              <figcaption class="atlas__caption">
                <div class="atlas__caption-heading">
                  <h2>Whirlpool Galaxy</h2>
                  <a class="text-link" href="https://science.nasa.gov/mission/hubble/science/explore-the-night-sky/hubble-messier-catalog/messier-51/">
                    Hubble observation <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11"/></svg>
                  </a>
                </div>
                <p>Pink clouds trace the places where new stars are forming along M51’s spiral arms.</p>
                <small class="credit">NASA, ESA, S. Beckwith (STScI), and the Hubble Heritage Team (STScI/AURA)</small>
              </figcaption>
            </figure>
          </article>
          <article class="atlas__panel" id="orion">
            <figure>
              <img class="atlas__photo" src="../assets/orion.jpg" alt="Bright young stars inside the pink and brown clouds of the Orion Nebula" width="1280" height="1280" loading="lazy" decoding="async">
              <figcaption class="atlas__caption">
                <div class="atlas__caption-heading">
                  <h2>Orion Nebula</h2>
                  <a class="text-link" href="https://science.nasa.gov/mission/hubble/science/explore-the-night-sky/hubble-messier-catalog/messier-42/">
                    Hubble observation <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11"/></svg>
                  </a>
                </div>
                <p>Four massive young stars at the nebula’s center light up and sculpt the surrounding clouds of gas.</p>
                <small class="credit">NASA, ESA, M. Robberto (STScI/ESA), and the Hubble Space Telescope Orion Treasury Project Team</small>
              </figcaption>
            </figure>
          </article>
          <article class="atlas__panel" id="saturn">
            <figure>
              <img class="atlas__photo atlas__photo--saturn" src="../assets/saturn.jpg" alt="Sunlight rims Saturn and catches the far side of its rings against black space" width="1280" height="533" loading="lazy" decoding="async">
              <figcaption class="atlas__caption">
                <div class="atlas__caption-heading">
                  <h2>Saturn</h2>
                  <a class="text-link" href="https://science.nasa.gov/resource/a-farewell-to-saturn-2/">
                    Cassini observation <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11"/></svg>
                  </a>
                </div>
                <p>Cassini captured this sunlit crescent and the surrounding rings shortly before its final descent into Saturn.</p>
                <small class="credit">NASA/JPL-Caltech/Space Science Institute</small>
              </figcaption>
            </figure>
          </article>
        </div>
      </section>
    </main>
