<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0d10">
    <meta name="robots" content="noindex">
    <!-- A 404 page is served at whatever path was requested, so every link below resolves from this base.
         The publish package (scripts/build-demo.mjs --base) rewrites it for a project subpath. -->
    <base href="/">
    <title>Page not found — AstroNot</title>
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="routes.js" defer></script>
    <script src="site.js" defer></script>
  </head>
  <body class="public-page">
    <a class="skip-link" href="#page-content" onclick="document.getElementById('page-content').focus(); return false;">Skip to content</a>

    <div class="page-top" id="top">
      <header class="site-header frame" data-header>
        <a class="wordmark" href="index.html" data-route="/" aria-label="AstroNot home">
          <img src="assets/mark.svg" width="40" height="40" alt="">
          <span>AstroNot<span class="wordmark__period">.</span></span>
        </a>
        <button class="menu-toggle icon-button" type="button" aria-label="Menu" aria-controls="site-nav" aria-expanded="false" data-menu-toggle hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="menu-toggle__open" d="M4 8h16M4 16h16"/>
            <path class="menu-toggle__close" d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Main navigation">
          <a href="explore/index.html" data-route="/explore">Explore</a>
          <a href="tools/index.html" data-route="/tools">Tools</a>
          <a href="learn/index.html" data-route="/learn">Learn</a>
          <a href="about/index.html" data-route="/about">About</a>
        </nav>
      </header>
    </div>

    <main id="page-content" tabindex="-1">
      <section class="frame about-page section-space" aria-labelledby="not-found-title">
        <header class="about-page__heading">
          <h1 class="section-title" id="not-found-title">Page not found</h1>
          <p class="section-lede">This address does not lead to a page on AstroNot. Check the link, or start again from the home page.</p>
        </header>
        <div class="about-page__sections">
          <section aria-labelledby="not-found-links">
            <h2 id="not-found-links">Where to next</h2>
            <p><a class="text-link" href="index.html" data-route="/">Go to the home page <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11"/></svg></a></p>
            <p><a class="text-link" href="tools/index.html" data-route="/tools">Browse the scientific tools <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11"/></svg></a></p>
          </section>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <div class="frame page-footer__inner">
        <a class="wordmark" href="index.html" data-route="/" aria-label="AstroNot home">
          <img src="assets/mark.svg" width="36" height="36" alt="">
          <span>AstroNot<span class="wordmark__period">.</span></span>
        </a>
      </div>
    </footer>
  </body>
</html>
