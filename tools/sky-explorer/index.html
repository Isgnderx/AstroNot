<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0b0d10">
    <title>Sky Explorer — AstroNot</title>
    <link rel="icon" href="../../assets/mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../tools/workspace.css">
    <script src="../../routes.js" defer></script>
    <script src="../../tools/registry.js" defer></script>
    <script src="../../tools/workspace.js" defer></script>
  </head>
  <body class="workspace-page" data-workspace-id="sky-survey-viewer">
    <a class="skip-link" href="#workspace-main">Skip to workspace</a>
    <header class="workspace-bar">
      <div class="workspace-frame workspace-bar__inner">
        <div class="workspace-bar__identity">
          <a class="wordmark" href="../../index.html" data-route="/" aria-label="AstroNot home">
            <img src="../../assets/mark.svg" width="36" height="36" alt="">
            <span>AstroNot<span class="wordmark__period">.</span></span>
          </a>
          <nav class="workspace-crumb" aria-label="Breadcrumb">
            <a class="workspace-back" href="../../tools/index.html" data-route="/tools">Tools</a>
            <span aria-hidden="true">/</span>
            <span aria-current="page" data-workspace-crumb>Sky Explorer</span>
          </nav>
        </div>
        <span class="workspace-bar__label">Scientific workspace</span>
      </div>
    </header>

    <main class="workspace-frame workspace" id="workspace-main" tabindex="-1">
      <header class="workspace-heading">
        <p class="workspace-category" data-workspace-category>Observation</p>
        <h1 data-workspace-title>Sky Explorer</h1>
        <p class="workspace-description" data-workspace-description>Navigate SPHEREx images by RA and Dec. Pan, zoom, and adjust the field of view.</p>
      </header>
      <div data-workspace-content></div>
      <noscript><p class="workspace-status">Coming Soon. Enable JavaScript to view the workspace preview.</p></noscript>
    </main>
  </body>
</html>
